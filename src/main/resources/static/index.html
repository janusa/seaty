<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Seaty</title>
    <link href="/favicon.ico" rel="icon" sizes="any">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@100;200;300;400;500&display=swap"
          rel="stylesheet">
</head>
<body class="page">
<header class="container app-header">
    <a aria-label="Go back" href="/">
    </a>
    <h1>Guest Search</h1>
    <form role="search">
        <div class="search-container">
            <svg aria-hidden="true"
                 class="search-icon"
                 fill="none"
                 focusable="false"
                 stroke="currentColor"
                 stroke-width="1.5"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>


            <input
                aria-label="Search for your name"
                autocomplete="off"
                class="search-input"
                id="guest-search"
                name="name"
                placeholder="Search for your name..."
                type="search">
        </div>
    </form>
</header>
<main class="container">
    <section aria-live="polite" class="search-result-container" id="search-result-container">
        <p>
            Start typing to find your seat!
        </p>
    </section>
</main>
<script src="scripts/script.js"></script>
</body>
</html>

spring.application.name=seaty
spring.main.banner-mode=off
spring.mvc.problemdetails.enabled=true
# Static resources (CSS/JS/SVG/images/favicons) are versionless but fixed for the event, so let the
# browser reuse them across reloads instead of revalidating each time. Private, matching the guest-list
# endpoint, since most are served behind the auth interceptor.
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-private=true
spring.datasource.url=jdbc:sqlite:file:./data/app.db?mode=ro&foreign_keys=true
spring.datasource.hikari.connection-init-sql=PRAGMA query_only=ON
auth.secret=${SEATY_AUTH_SECRET}
spring.output.ansi.enabled=always
# The app runs behind a TLS-terminating reverse proxy on localhost; trust its X-Forwarded-*
# headers so request.remoteAddr and the request scheme reflect the real client, not the proxy.
server.forward-headers-strategy=native
